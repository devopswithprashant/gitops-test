name: 'Deploy'

on:
  push:
  pull_request:


permissions:
  contents: read
  id-token: write # <--- REQUIRED for OIDC


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  Deploy-K8:
    name: 'Deploy-K8'
    runs-on: ubuntu-latest
    environment: dev

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 10
    
    - name: Determine before/after SHAs
      id: shas
      run: |
        echo "BEFORE=${{ github.event.before }}" >> $GITHUB_ENV
        echo "AFTER=${{ github.sha }}" >> $GITHUB_ENV
        #echo "before=${{ github.event.before }}" > shas.txt
        #echo "after=${{ github.sha }}" >> shas.txt
        #cat shas.txt
    
    
    - name: List changed files between commits (safe)
      id: list-changed
      run: |
        set -euo pipefail
        BEFORE="${BEFORE}"
        AFTER="${AFTER}"

        # Ensure changed.txt exists (empty if none)
        : > changed.txt

        if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
          # branch created or first commit — list files in the AFTER commit
          git diff --name-only "${AFTER}" > changed.txt || true
        else
          git diff --name-only "${BEFORE}" "${AFTER}" > changed.txt || true
        fi

        echo "Changed files (raw):"
        sed -n '1,200p' changed.txt || true

        # write to step output using GITHUB_OUTPUT
        CHANGED_RAW=$(sed -z 's/\n/|/g' changed.txt || true)
        echo "files=${CHANGED_RAW}" >> "$GITHUB_OUTPUT"

    - name: Compute changed overlay dirs + app/env (store in env)
      id: compute-dirs
      run: |
        set -euo pipefail

        # ensure changed.txt exists
        if [ ! -f changed.txt ]; then
          echo "changed.txt missing, creating empty file"
          : > changed.txt
        fi

        # Filter only relevant files under apps/ (no failure if none)
        : > files_under_apps.txt
        grep -E '^apps/' changed.txt > files_under_apps.txt || true

        # Remove filename (strip last path segment) and dedupe
        : > changed_dirs.txt
        awk -F'/' 'NF>=2 { $NF=""; sub(/\/$/, "", $0); print } NF<2 { if (NF>0) print }' files_under_apps.txt \
          | sort -u > changed_dirs.txt || true

        # Prepare arrays
        DIRS=()
        APPS=()
        ENVS=()

        while IFS= read -r line; do
          # skip empty lines
          [ -z "${line}" ] && continue
          DIRS+=("$line")

          # split by '/'
          IFS='/' read -ra parts <<< "$line"
          # parts[0] == "apps"
          len=${#parts[@]}

          app=""
          env=""

          if [ "$len" -eq 3 ]; then
            # apps/<app>/<env>
            app="${parts[1]}"
            env="${parts[2]}"
          elif [ "$len" -ge 4 ]; then
            # apps/<team>/<app>/<env>/...
            # pick the third segment as app and fourth as env
            app="${parts[2]}"
            env="${parts[3]}"
          else
            # fallback: try to use last two segments if possible
            if [ "$len" -ge 2 ]; then
              app="${parts[$((len-2))]}"
              env="${parts[$((len-1))]}"
            fi
          fi

          APPS+=("$app")
          ENVS+=("$env")
        done < changed_dirs.txt

        # Helper to join & dedupe while preserving readable order
        join_and_dedupe() {
          arr=("$@")
          # print each on new line, sort -u, then join with comma
          printf "%s\n" "${arr[@]}" | awk 'NF' | awk '!x[$0]++' | paste -sd, - || echo ""
        }

        FOUND_DIRS=$(join_and_dedupe "${DIRS[@]}")
        FOUND_APPS=$(join_and_dedupe "${APPS[@]}")
        FOUND_ENVS=$(join_and_dedupe "${ENVS[@]}")

        # Export to GITHUB_ENV
        echo "FOUND_DIRS=${FOUND_DIRS}" >> "$GITHUB_ENV"
        echo "FOUND_APPS=${FOUND_APPS}" >> "$GITHUB_ENV"
        echo "FOUND_ENVS=${FOUND_ENVS}" >> "$GITHUB_ENV"

        # debug log (remove later if you want)
        echo "FOUND_DIRS='${FOUND_DIRS}'"
        echo "FOUND_APPS='${FOUND_APPS}'"
        echo "FOUND_ENVS='${FOUND_ENVS}'"




    
