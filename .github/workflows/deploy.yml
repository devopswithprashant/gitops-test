name: 'Deploy'

on:
  push:
  pull_request:


permissions:
  contents: read
  id-token: write # <--- REQUIRED for OIDC


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  Deploy-K8:
    name: 'Deploy-K8'
    runs-on: ubuntu-latest
    environment: dev

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 10
    
    
    
    - name: Determine the change env by before/after SHAs (multi-dir safe)
      id: find_change_env
      run: |
        set -euo pipefail

        # Git-provided SHAs (substituted by Actions at runtime)
        BEFORE=${{ github.event.before }}
        AFTER=${{ github.sha }}

        echo "BEFORE=${BEFORE}"
        echo "AFTER=${AFTER}"

        # Ensure changed.txt exists (empty if none)
        : > changed.txt

        if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
          # branch created or first commit — list files in the AFTER commit
          git diff --name-only "${AFTER}" > changed.txt || true
        else
          git diff --name-only "${BEFORE}" "${AFTER}" > changed.txt || true
        fi

        echo "Changed files (raw):"
        sed -n '1,200p' changed.txt || true

        # Also expose raw file list as a step output (pipe-separated like previously)
        # Use a safe replace of newlines with '|' (no jq)
        if [ -s changed.txt ]; then
          CHANGED_RAW=$(paste -sd'|' changed.txt)
        else
          CHANGED_RAW=""
        fi
        echo "files=${CHANGED_RAW}" >> "${GITHUB_OUTPUT}"

        # ----------------------------
        # Build ordered, deduped list of relevant directories (apps/...)
        # ----------------------------
        declare -a DIRS=()
        declare -a APPS=()
        declare -a ENVS=()

        # iterate in file order to preserve order
        while IFS= read -r file_path || [ -n "$file_path" ]; do
          [ -z "$file_path" ] && continue

          # only consider files under apps/
          case "$file_path" in
            apps/*) ;;
            *) continue ;;
          esac

          # normalize (remove trailing slash)
          file_path="${file_path%/}"

          # strip filename: everything before last '/'
          if [[ "$file_path" == */* ]]; then
            dir="${file_path%/*}"
          else
            dir="$file_path"
          fi
          dir="${dir%/}"

          # dedupe preserve order
          skip=0
          for existing in "${DIRS[@]}"; do
            if [ "$existing" = "$dir" ]; then
              skip=1
              break
            fi
          done
          [ $skip -eq 1 ] && continue

          # add to DIRS
          DIRS+=("$dir")

          # split path into parts
          IFS='/' read -ra parts <<< "$dir"
          plen=${#parts[@]}

          app=""
          env=""

          # support both layouts:
          # - apps/<app>/<env>
          # - apps/<team>/<app>/<env>/...
          if [ "$plen" -ge 4 ]; then
            # apps / team / app / env / ...
            app="${parts[2]}"
            env="${parts[3]}"
          elif [ "$plen" -eq 3 ]; then
            # apps / app / env
            app="${parts[1]}"
            env="${parts[2]}"
          else
            # fallback: try last two parts
            if [ "$plen" -ge 2 ]; then
              app="${parts[$((plen-2))]}"
              env="${parts[$((plen-1))]}"
            fi
          fi

          APPS+=("$app")
          ENVS+=("$env")
        done < changed.txt

        # join helper (comma separated)
        join_by_comma() {
          local IFS=','
          echo "$*"
        }

        if [ ${#DIRS[@]} -eq 0 ]; then
          FOUND_DIRS=""
          FOUND_APPS=""
          FOUND_ENVS=""
        else
          FOUND_DIRS=$(join_by_comma "${DIRS[@]}")
          FOUND_APPS=$(join_by_comma "${APPS[@]}")
          FOUND_ENVS=$(join_by_comma "${ENVS[@]}")
        fi

        # Export to env for subsequent steps
        echo "FOUND_DIRS=${FOUND_DIRS}" >> "$GITHUB_ENV"
        echo "FOUND_APPS=${FOUND_APPS}" >> "$GITHUB_ENV"
        echo "FOUND_ENVS=${FOUND_ENVS}" >> "$GITHUB_ENV"

        # Also set dirs_csv as a step output for compatibility
        echo "dirs_csv=${FOUND_DIRS}" >> "${GITHUB_OUTPUT}"

        # ----------------------------
        # Validation: all apps must be 'blog' (as in your original check)
        # and each env must be one of dev|qa|stage|prod
        # ----------------------------
        # If no dirs found, we don't fail — just set outputs and exit 0.
        if [ -z "${FOUND_DIRS}" ]; then
          echo "No changed apps/* paths found — nothing to validate."
          echo "PRODlower=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # Validate apps and envs per-index
        IFS=',' read -ra APPS_ARR <<< "$FOUND_APPS"
        IFS=',' read -ra ENVS_ARR <<< "$FOUND_ENVS"

        # allowed envs
        valid_envs_regex='^(dev|qa|stage|prod)$'
        prod_detected=false

        for i in "${!APPS_ARR[@]}"; do
          a="${APPS_ARR[$i]}"
          e="${ENVS_ARR[$i]}"

          # app validation
          if [ -z "$a" ]; then
            echo "Invalid app detected (empty) for dir: ${DIRS[$i]}"
            exit 1
          fi
          if [ "$a" != "blog" ]; then
            echo "Not able to find the change in correct app, invalid appName: $a"
            echo "exiting..."
            exit 1
          fi

          # env validation
          if ! [[ "$e" =~ $valid_envs_regex ]]; then
            echo "Not able to find the change in correct env, invalid envName: $e"
            echo "exiting..."
            exit 1
          fi

          if [ "$e" = "prod" ]; then
            prod_detected=true
          fi
        done

        # Set PRODlower: true if any prod detected and branch is not main
        BRANCH_NAME='${{ github.ref_name }}'
        if [ "$prod_detected" = true ] && [ "$BRANCH_NAME" != "main" ]; then
          echo "PRODlower=true" >> "${GITHUB_OUTPUT}"
        else
          echo "PRODlower=false" >> "${GITHUB_OUTPUT}"
        fi

        # debug logs
        echo "FOUND_DIRS='${FOUND_DIRS}'"
        echo "FOUND_APPS='${FOUND_APPS}'"
        echo "FOUND_ENVS='${FOUND_ENVS}'"
        echo "PRODlower=$(cat ${GITHUB_OUTPUT} | sed -n 's/^PRODlower=//p' || true )"



